# Supabase-compatible API surface for the local stack.
# The app calls ${SUPABASE_URL}/auth/v1/* and ${SUPABASE_URL}/rest/v1/* (see
# packages/identity/src/supabaseAuth.ts and packages/shared/src/durableCommerce.ts).
# Hosted Supabase fronts GoTrue and PostgREST the same way, so pointing
# NEXT_PUBLIC_SUPABASE_URL at a hosted project needs no code change.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  server_tokens off;
  client_max_body_size 16m;

  upstream gotrue {
    server auth:9999;
  }

  upstream postgrest {
    server rest:3000;
  }

  server {
    listen 8000;

    location = /health {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location /auth/v1/ {
      proxy_pass http://gotrue/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/v1/ {
      proxy_pass http://postgrest/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # PostgREST reads the bearer token; the apikey header is Supabase routing metadata.
      proxy_set_header Accept-Profile $http_accept_profile;
      proxy_set_header Content-Profile $http_content_profile;
    }
  }
}
