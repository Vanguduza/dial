name: DialCustomer
options:
  bundleIdPrefix: zw.co.dial
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  DialCustomerCore:
    path: .
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: zw.co.dial.customer
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: App/Info.plist
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${APPLE_DEVELOPMENT_TEAM}
targets:
  DialCustomer:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: DialCustomerCore
        product: DialCustomerCore
    settings:
      base:
        PRODUCT_NAME: DialCustomer
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: App/DialCustomer.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DIAL
        UILaunchScreen: {}
    entitlements:
      path: App/DialCustomer.entitlements
  DialCustomerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/DialCustomerCoreTests
    dependencies:
      - target: DialCustomer
      - package: DialCustomerCore
        product: DialCustomerCore
