# Self-hosted maps overlay for docker-compose.prod.yml
#   pnpm stack:up --maps
#
# Tiles: drop a Zimbabwe mbtiles at infra/maps/data/zimbabwe.mbtiles
# (Planetiler output; gitignored). Until then tileserver serves an empty
# volume and the web map falls back to OpenFreeMap Liberty / raster.

name: dial

services:
  tileserver:
    image: maptiler/tileserver-gl:v4.11.1
    restart: unless-stopped
    volumes:
      - ./infra/maps/data:/data:ro
    command: ["--verbose"]
    ports:
      - "${TILESERVER_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  nominatim:
    image: mediagis/nominatim:4.4
    restart: unless-stopped
    environment:
      PBF_URL: ${NOMINATIM_PBF_URL:-https://download.geofabrik.de/africa/zimbabwe-latest.osm.pbf}
      REPLICATION_URL: ${NOMINATIM_REPLICATION_URL:-https://download.geofabrik.de/africa/zimbabwe-updates/}
      IMPORT_WIKIPEDIA: "false"
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
    ports:
      - "${NOMINATIM_HOST_PORT:-8088}:8080"
    volumes:
      - dial_nominatim:/var/lib/postgresql/14/main

  osrm:
    image: osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    volumes:
      - ./infra/maps/data:/data
    command: >
      osrm-routed --algorithm mld /data/zimbabwe-latest.osrm
    ports:
      - "${OSRM_HOST_PORT:-5000}:5000"

  vroom:
    image: vroomvrp/vroom-docker:v1.14.0
    restart: unless-stopped
    environment:
      VROOM_ROUTER: osrm
    ports:
      - "${VROOM_HOST_PORT:-3001}:3000"
    depends_on:
      - osrm

  gateway:
    environment:
      MAP_TILES_STYLE_URL: ${MAP_TILES_STYLE_URL:-http://tileserver:8080/styles/basic-preview/style.json}
      NOMINATIM_URL: ${NOMINATIM_URL:-http://nominatim:8080}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      VROOM_URL: ${VROOM_URL:-http://vroom:3000}

volumes:
  dial_nominatim:
