# Phase 1 / G1 staging compose — Redis + Meili (+ Temporal profile).
# Dogfood: docs/ops/phase1-sandbox-dogfood.md
# Phase 5 Temporal: docs/ops/phase5-delivery-temporal-dogfood.md
# Maps Tier-2 (ENH-013): docs/ops/maps-tier2-compose.md — not in default compose
# Local infra for sandbox / key-drop-in smoke (S92).
# Does not run in CI. Never put live PSP/WA/FDMS secrets in compose env.
#
#   docker compose up -d redis meilisearch
#   docker compose --profile temporal up -d
#
# Then point .env:
#   REDIS_URL=redis://127.0.0.1:6379
#   MEILI_HOST=http://127.0.0.1:7700
#   MEILI_MASTER_KEY=dev_master_key_change_me
#   TEMPORAL_ADDRESS=127.0.0.1:7233
#   TEMPORAL_NAMESPACE=dial
#   DIAL_INTEGRATION_MODE=sandbox

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_change_me}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal-db:
    profiles: ["temporal"]
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    profiles: ["temporal"]
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_SEEDS: temporal-db
      # Omit DYNAMIC_CONFIG_FILE_PATH — auto-setup image lacks mounted development-sql.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    profiles: ["temporal"]
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  meili_data:
  temporal_pg:

