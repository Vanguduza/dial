# Promptfoo golden assertions (D-54 / D-56) — CI smoke via evals/run-smoke.mjs.
# Optional full eval when Promptfoo CLI is installed:
#   npx promptfoo eval -c packages/ai/evals/promptfooconfig.yaml
# CI stays fixture-guidedIntake until LITELLM_* is set for live providers.

description: DIAL packages/ai guidedIntake golden assertions (no money)

prompts:
  - "Customer text: {{customerText}}\nReturn JobAssessment JSON only. Never include price or amountMinor."

providers:
  - id: file://providers/guided-intake-fixture.mjs
    label: guidedIntake-fixture

tests:
  - vars:
      customerText: "Car won't start, maybe battery"
    assert:
      - type: not-contains
        value: amountMinor
      - type: not-contains
        value: '"price"'
      - type: contains
        value: needsHumanQuote
  - vars:
      customerText: "Emergency tow after accident"
    assert:
      - type: not-contains
        value: amountMinor
      - type: contains
        value: '"urgency":"emergency"'
      - type: contains
        value: needsHumanQuote
